"$schema" = "./node_modules/wrangler/config-schema.json"
name = "ai-api-key-checker"
main = "src/index.ts"
compatibility_date = "2026-05-11"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"

[vars]
ACCESS_MODE = "private"
REQUEST_TIMEOUT_MS = "10000"
